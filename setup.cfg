[tool:pytest]
testpaths = tests
addopts = -q --tb=short

[coverage:run]
source = backtesting,ml,strategies,webapp,ui
omit =
    */__pycache__/*
    */models/*
    */static/*
    */templates/*

[coverage:report]
exclude_lines =
    pragma: no cover
    if __name__ == .__main__
    ^\s*\.\.\.
    raise NotImplementedError
show_missing = true
