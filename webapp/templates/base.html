<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Stock Predictor{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
    {% block head %}{% endblock %}
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">
            <a href="/">&#128200; Stock Predictor</a>
        </div>
        <div class="nav-search">
            <input type="text" id="ticker-search" placeholder="Search ticker (e.g., AAPL)" autocomplete="off">
            <div id="search-results" class="search-dropdown"></div>
        </div>
        <div class="nav-links">
            <a href="/">Dashboard</a>
            <a href="/strategies">Strategies</a>
            <a href="/market">Market</a>
            <a href="/picks">Your Picks</a>
            <a href="/ml">ML Models</a>
        </div>
    </nav>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <p>Stock Predictor &mdash; For educational/research purposes only. Not financial advice.</p>
    </footer>

    <script src="/static/js/app.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
